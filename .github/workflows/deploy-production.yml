name: Deploy to Production (Afrihost)

# STRICT PRODUCTION GATE: Manual Approval & Trigger Only
# Live production will NEVER deploy automatically on push.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Afrihost Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Deploy to Afrihost Production via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AFRIHOST_PROD_SERVER || secrets.AFRIHOST_SERVER }}
          username: ${{ secrets.AFRIHOST_PROD_USERNAME }}
          password: ${{ secrets.AFRIHOST_PROD_PASSWORD }}
          server-dir: ${{ secrets.AFRIHOST_PROD_DIR || 'public_html/' }}
          local-dir: dist/
          protocol: ${{ secrets.AFRIHOST_PROTOCOL || 'ftp' }}
          port: ${{ secrets.AFRIHOST_PORT || 21 }}
          security: ${{ secrets.AFRIHOST_SECURITY || 'loose' }}
          dangerous-clean-slate: false
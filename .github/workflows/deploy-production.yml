name: Deploy to Production (Afrihost)

# STRICT PRODUCTION GATE: Manual Approval & Trigger Only
# Live production will NEVER deploy automatically on push.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Afrihost Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Deploy to Afrihost Production via Direct FTP
        env:
          FTP_SERVER: ${{ secrets.AFRIHOST_PROD_SERVER || secrets.AFRIHOST_SERVER || 'ftp.lycoscore.com' }}
          FTP_USER: ${{ secrets.AFRIHOST_PROD_USERNAME }}
          FTP_PASSWORD: ${{ secrets.AFRIHOST_PROD_PASSWORD }}
          FTP_PORT: ${{ secrets.AFRIHOST_PORT || 21 }}
          FTP_DIR: ${{ secrets.AFRIHOST_PROD_DIR || './' }}
        run: node scripts/deploy-ftp.js
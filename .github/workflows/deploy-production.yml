name: Deploy to Production (Afrihost)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Afrihost Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Deploy to Afrihost via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AFRIHOST_SERVER }}
          username: ${{ secrets.AFRIHOST_USERNAME }}
          password: ${{ secrets.AFRIHOST_PASSWORD }}
          server-dir: ${{ secrets.AFRIHOST_REMOTE_DIR || 'public_html/' }}
          local-dir: dist/
          protocol: ftps
          dangerous-clean-slate: false
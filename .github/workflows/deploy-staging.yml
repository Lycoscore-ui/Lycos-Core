name: Deploy to Staging (Afrihost)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    name: Build & Deploy to Staging Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: v2-development/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: v2-development/frontend
        run: npm ci

      - name: Build Staging Assets
        working-directory: v2-development/frontend
        run: npm run build

      - name: Prepare Staging Distribution Payload
        run: |
          mkdir -p dist_payload
          cp -r app/public/* dist_payload/
          cp -r v2-development/frontend/dist/assets/* dist_payload/assets/
          cp v2-development/frontend/dist/index.html dist_payload/index.html

      - name: Deploy to Afrihost Staging via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AFRIHOST_SERVER }}
          username: ${{ secrets.AFRIHOST_USERNAME }}
          password: ${{ secrets.AFRIHOST_PASSWORD }}
          server-dir: ${{ secrets.AFRIHOST_STAGING_DIR || 'public_html/staging/' }}
          local-dir: dist_payload/
          protocol: ftps
          dangerous-clean-slate: false
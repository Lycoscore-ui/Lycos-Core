name: Deploy to Staging (Afrihost)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    name: Build & Deploy to Staging Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Staging Assets
        run: npm run build

      - name: Deploy to Afrihost Staging via Direct FTP
        env:
          FTP_SERVER: ${{ secrets.AFRIHOST_SERVER }}
          FTP_USER: ${{ secrets.AFRIHOST_USERNAME }}
          FTP_PASSWORD: ${{ secrets.AFRIHOST_PASSWORD }}
          FTP_PORT: ${{ secrets.AFRIHOST_PORT || 21 }}
          FTP_DIR: ${{ secrets.AFRIHOST_STAGING_DIR || './' }}
        run: node scripts/deploy-ftp.js
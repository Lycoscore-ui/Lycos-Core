name: Deploy to Staging (Afrihost)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    name: Build & Deploy to Staging Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Staging Assets
        run: npm run build

      - name: Deploy to Afrihost Staging via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AFRIHOST_SERVER }}
          username: ${{ secrets.AFRIHOST_USERNAME }}
          password: ${{ secrets.AFRIHOST_PASSWORD }}
          server-dir: ${{ secrets.AFRIHOST_STAGING_DIR || 'staging.lycoscore.com/' }}
          local-dir: dist/
          protocol: ${{ secrets.AFRIHOST_PROTOCOL || 'ftp' }}
          port: ${{ secrets.AFRIHOST_PORT || 21 }}
          security: ${{ secrets.AFRIHOST_SECURITY || 'loose' }}
          dangerous-clean-slate: false
          log-level: verbose